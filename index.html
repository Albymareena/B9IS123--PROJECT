<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milma Society Information System</title>
</head>
<body>
     <div id="farmers-section" class="section active">
            <h2>Manage Farmers</h2>
            <h3>Add/Edit Farmer</h3>
            <form id="farmer-form">
                <input type="hidden" id="farmer-id">
                <div class="form-group">
                    <label for="farmer-name">Name:</label>
                    <input type="text" id="farmer-name" required>
                    <span id="farmer-name-error" class="error"></span>
                </div>
                <div class="form-group">
                    <label for="farmer-village">Village:</label>
                    <input type="text" id="farmer-village" required>
                    <span id="farmer-village-error" class="error"></span>
                </div>
                <div class="form-group">
                    <label for="farmer-contact">Contact:</label>
                    <input type="text" id="farmer-contact" required>
                    <span id="farmer-contact-error" class="error"></span>
                </div>
                <button type="submit">Save Farmer</button>
                <button type="button" onclick="clearFarmerForm()">Clear</button>
            </form>
            <h3>All Farmers</h3>
            <table id="farmers-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Village</th>
                        <th>Contact</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="farmers-tbody">
                    <tr><td colspan="5">Loading farmers...</td></tr>
                </tbody>
            </table>
        </div>
<script>
        // API base URL for backend connection
        const API_BASE = "http://127.0.0.1:5000/api";

        // Show a message (success or error)
        function showMessage(text, isError = false) {
            const messageDiv = document.getElementById('status-message');
            messageDiv.innerHTML = `<p class="${isError ? 'error' : 'success'}">${text}</p>`;
            setTimeout(() => messageDiv.innerHTML = '', 3000);
        }

        // Show one section at a time
        function showSection(sectionName) {
            // Hide all sections and remove active class from buttons
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.nav-buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
            // Show the selected section and make its button active
            document.getElementById(sectionName + '-section').classList.add('active');
            document.getElementById('nav-' + sectionName).classList.add('active');
            // Load data for the section
            if (sectionName === 'farmers') loadFarmers();
            if (sectionName === 'milk') loadMilkCollections();
            if (sectionName === 'payments') loadPayments();
        }
        async function loadFarmers() {
            try {
                const response = await fetch(`${API_BASE}/farmers`);
                const farmers = await response.json();
                const tbody = document.getElementById('farmers-tbody');
                if (farmers.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">No farmers found</td></tr>';
                    return;
                }
                tbody.innerHTML = farmers.map(farmer => `
                    <tr>
                        <td>${farmer.id}</td>
                        <td>${farmer.name}</td>
                        <td>${farmer.village}</td>
                        <td>${farmer.contact}</td>
                        <td>
                            <button class="edit-btn" onclick="editFarmer(${farmer.id})">Edit</button>
                            <button class="delete-btn" onclick="deleteFarmer(${farmer.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
                populateFarmerDropdowns();
            } catch (error) {
                showMessage('Failed to load farmers', true);
            }
        }

        async function editFarmer(id) {
            try {
                const response = await fetch(`${API_BASE}/farmers/${id}`);
                const farmer = await response.json();
                document.getElementById('farmer-id').value = farmer.id;
                document.getElementById('farmer-name').value = farmer.name;
                document.getElementById('farmer-village').value = farmer.village;
                document.getElementById('farmer-contact').value = farmer.contact;
            } catch (error) {
                showMessage('Failed to load farmer details', true);
            }
        }

        async function deleteFarmer(id) {
            if (!confirm('Are you sure you want to delete this farmer?')) return;
            try {
                await fetch(`${API_BASE}/farmers/${id}`, { method: 'DELETE' });
                showMessage('Farmer deleted');
                loadFarmers();
            } catch (error) {
                showMessage('Failed to delete farmer', true);
            }
        }

        function clearFarmerForm() {
            document.getElementById('farmer-form').reset();
            document.getElementById('farmer-id').value = '';
            document.getElementById('farmer-name-error').textContent = '';
            document.getElementById('farmer-village-error').textContent = '';
            document.getElementById('farmer-contact-error').textContent = '';
        }

        document.getElementById('farmer-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('farmer-id').value;
            const name = document.getElementById('farmer-name').value;
            const village = document.getElementById('farmer-village').value;
            const contact = document.getElementById('farmer-contact').value;

            // Simple validation
            let isValid = true;
            if (!name) {
                document.getElementById('farmer-name-error').textContent = 'Name is required';
                isValid = false;
            }
            if (!village) {
                document.getElementById('farmer-village-error').textContent = 'Village is required';
                isValid = false;
            }
            if (!contact) {
                document.getElementById('farmer-contact-error').textContent = 'Contact is required';
                isValid = false;
            }
            if (!isValid) return;

            try {
                if (id) {
                    // Update farmer
                    await fetch(`${API_BASE}/farmers/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, village, contact })
                    });
                    showMessage('Farmer updated');
                } else {
                    // Add new farmer
                    await fetch(`${API_BASE}/farmers`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, village, contact })
                    });
                    showMessage('Farmer added');
                }
                clearFarmerForm();
                loadFarmers();
            } catch (error) {
                showMessage('Failed to save farmer', true);
            }
        });

        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadFarmers();
            showSection('farmers');
        });
    </script>
</body>
</html>
